# Chạy cả hệ thống bằng một lệnh (từ thư mục gốc repo):
#     docker compose up --build
# rồi mở http://localhost:8501 (giao diện) và http://localhost:8000/docs (API).
#
# Lần đầu, service setup chuẩn bị chỉ mục trong volume music_data (xem docker/setup.sh):
# chép chỉ mục đã dựng sẵn trên máy nếu có, nếu không thì dựng từ dữ liệu MPD gốc đặt ở data/raw/
# (hoặc thư mục MPD_DATA_DIR), khoảng 30 phút. Các lần sau setup bỏ qua ngay. Chi tiết: docs/docker.md.
x-app: &app
  build: .
  image: music-recommender:latest
  volumes:
    - music_data:/app/hdfs_sim/music:ro
    # Mô hình ALS đã xuất (không bắt buộc): thư mục trống thì API chạy không có mô hình als
    - ./hdfs_sim/music/analytics/als:/app/als:ro

services:
  setup:
    <<: *app
    command: ["bash", "docker/setup.sh"]
    volumes:
      - music_data:/app/hdfs_sim/music
      - ./hdfs_sim/music/analytics/app_index:/seed/app_index:ro
      - ${MPD_DATA_DIR:-./data/raw}:/data/mpd:ro

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  dashboard:
    <<: *app
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      MUSIC_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  music_data:
